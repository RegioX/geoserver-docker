server {
    listen 80;
    listen [::]:80;

    server_name gs.regiox.no;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://gs.regiox.no$request_uri;
    }
}


server {
    listen 443 default_server ssl http2;
    listen [::]:443 ssl http2;

    server_name gs.regiox.no;

    ssl_certificate /etc/letsencrypt/ssl/live/gs.regiox.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/ssl/live/gs.regiox.no/privkey.pem;
    
    location / {
    	proxy_pass http://geoserver:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
