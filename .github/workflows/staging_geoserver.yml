# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - geoserver

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://regiox.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_477772c7aa8849b38a3c2b89124ab7e6 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_fd8d06e5556e433da1b7be342cf652df }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: regiox.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_477772c7aa8849b38a3c2b89124ab7e6 }}/regiox/rx/geoserver-docker:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'geoserver'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_f6ad9a0cd73d4bfea973a8429a849086 }}
        images: 'regiox.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_477772c7aa8849b38a3c2b89124ab7e6 }}/regiox/rx/geoserver-docker:${{ github.sha }}'